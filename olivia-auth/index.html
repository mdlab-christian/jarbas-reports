<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Conectar ao MdFlow (Olivia)</title>
<style>
body{background:#12100e;color:#f5f0eb;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#201d1a;border:1px solid #2e2b27;border-radius:14px;padding:28px 30px;max-width:420px;width:92%}
h1{font-size:19px;margin:0 0 6px}
p{font-size:13px;color:#9e9890;margin:0 0 16px;line-height:1.5}
input[type=password]{width:100%;box-sizing:border-box;background:#1a1714;border:1px solid #2e2b27;border-radius:8px;padding:11px 12px;color:#f5f0eb;font-family:monospace;font-size:13px}
button{width:100%;margin-top:14px;background:#20c997;border:0;border-radius:8px;padding:11px;color:#0c2b22;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.err{background:#ef444420;border:1px solid #ef444440;border-radius:8px;padding:8px 12px;color:#ef4444;font-size:13px;margin-bottom:12px;display:none}
.hint{font-size:11px;color:#9e9890;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h1>🔐 Conectar ao MdFlow (Olivia)</h1>
<p>Cole a sua <b>chave pessoal</b> (fornecida pelo Christian). Ela define o seu nível de acesso e fica autorizada nesta conta.</p>
<div class="err" id="err"></div>
<form id="f" method="POST" action="https://qdivfairxhdihaqqypgb.supabase.co/functions/v1/mcp-mdflow/authorize">
  <input type="password" name="chave" id="chave" placeholder="chave pessoal (64 caracteres)" autofocus required>
  <button type="submit" id="btn">Conectar</button>
</form>
<p class="hint">MDX LegalTech · a chave nunca fica salva nesta página</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var f = document.getElementById('f');
  var campos = ['client_id', 'redirect_uri', 'state', 'code_challenge', 'code_challenge_method', 'resource', 'scope'];
  campos.forEach(function (k) {
    var v = q.get(k);
    if (!v) return;
    var i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = v;
    f.appendChild(i);
  });
  var err = document.getElementById('err');
  if (q.get('erro')) {
    err.textContent = 'Chave inválida ou revogada — confira com o Christian e tente de novo.';
    err.style.display = 'block';
  }
  if (!q.get('redirect_uri')) {
    err.textContent = 'Link incompleto — abra esta página pelo botão "Conectar" do claude.ai.';
    err.style.display = 'block';
    document.getElementById('btn').disabled = true;
  }
})();
</script>
</body>
</html>
